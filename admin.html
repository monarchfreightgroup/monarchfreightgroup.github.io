<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Monarch Freight Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#071d49;
padding:30px 15px;
color:white;
}

.container{
max-width:750px;
margin:auto;
background:#102b63;
padding:35px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

h1{
text-align:center;
font-size:50px;
margin-bottom:35px;
}

input,
textarea,
select{
width:100%;
padding:20px;
margin-bottom:20px;
border:none;
border-radius:14px;
font-size:18px;
outline:none;
font-family:'Poppins',sans-serif;
}

textarea{
height:140px;
resize:none;
}

button{
width:100%;
padding:22px;
border:none;
border-radius:15px;
background:#d8a726;
color:black;
font-size:22px;
font-weight:700;
cursor:pointer;
}

.success{
margin-top:25px;
background:#1fb655;
padding:18px;
border-radius:12px;
display:none;
font-weight:600;
text-align:center;
}

@media(max-width:700px){

h1{
font-size:40px;
}

}

</style>

</head>

<body>

<div class="container">

<h1>Create Shipment</h1>

<input type="text" id="trackingCode" placeholder="Tracking Code">

<input type="text" id="from" placeholder="From">

<input type="text" id="to" placeholder="To">

<select id="status">
<option>In Transit</option>
<option>Processing</option>
<option>Out For Delivery</option>
<option>Delivered</option>
</select>

<input type="text" id="weight" placeholder="Weight">

<input type="text" id="parcelType" placeholder="Parcel Type">

<input type="text" id="courier" placeholder="Courier">

<input type="date" id="eta">

<textarea id="timeline" placeholder="Timeline Updates (separate with commas)"></textarea>

<button onclick="saveShipment()">
SAVE SHIPMENT
</button>

<div class="success" id="successBox">
Shipment Saved Successfully
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyBEWibw3-cMhuOXvJVYt-omcx3TUuLnBwg",
authDomain: "monarch-freight.firebaseapp.com",
projectId: "monarch-freight",
storageBucket: "monarch-freight.firebasestorage.app",
messagingSenderId: "592212587562",
appId: "1:592212587562:web:f46b6d3d4438ac55467f53"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

window.saveShipment = async function(){

const trackingCode =
document.getElementById("trackingCode").value;

const from =
document.getElementById("from").value;

const to =
document.getElementById("to").value;

const status =
document.getElementById("status").value;

const weight =
document.getElementById("weight").value;

const parcelType =
document.getElementById("parcelType").value;

const courier =
document.getElementById("courier").value;

const eta =
document.getElementById("eta").value;

const timeline =
document.getElementById("timeline")
.value
.split(",");

await addDoc(
collection(db,"shipments"),
{
trackingCode,
from,
to,
status,
weight,
parcelType,
courier,
eta,
timeline,
createdAt:new Date()
}
);

document.getElementById("successBox")
.style.display = "block";

};

</script>

</body>
</html>
