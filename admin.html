<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Monarch Freight Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#071426;
color:#fff;
}

.login-screen,
.dashboard{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
background:#102948;
width:100%;
max-width:520px;
padding:35px;
border-radius:18px;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.logo{
font-size:32px;
font-weight:700;
margin-bottom:25px;
text-align:center;
}

.logo span{
color:#d4a63a;
}

h2{
margin-bottom:20px;
text-align:center;
}

input,
textarea,
select{
width:100%;
padding:16px;
margin-bottom:15px;
border:none;
border-radius:10px;
font-size:15px;
font-family:'Poppins',sans-serif;
outline:none;
}

textarea{
min-height:120px;
resize:none;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:10px;
background:#d4a63a;
color:#111;
font-size:16px;
font-weight:700;
cursor:pointer;
margin-top:10px;
}

button:hover{
opacity:0.9;
}

.logout{
background:#fff;
margin-top:15px;
}

.shipment-list{
margin-top:30px;
}

.shipment-item{
background:#0b1f39;
padding:18px;
border-radius:12px;
margin-bottom:15px;
}

.shipment-item h3{
margin-bottom:10px;
}

.link-box{
background:#071426;
padding:12px;
border-radius:8px;
font-size:13px;
word-break:break-all;
margin-top:10px;
}

.hidden{
display:none;
}

.success{
margin-top:15px;
background:#0e8b41;
padding:14px;
border-radius:10px;
text-align:center;
display:none;
}

</style>
</head>

<body>

<!-- LOGIN -->

<div class="login-screen" id="loginScreen">

<div class="card">

<div class="logo">
MONARCH <span>FREIGHT</span>
</div>

<h2>
Admin Login
</h2>

<input
type="password"
id="adminPassword"
placeholder="Enter Admin Password">

<button onclick="login()">
LOGIN
</button>

</div>

</div>

<!-- DASHBOARD -->

<div class="dashboard hidden" id="dashboard">

<div class="card">

<div class="logo">
MONARCH <span>FREIGHT</span>
</div>

<h2>
Create Shipment
</h2>

<input type="text" id="trackingCode" placeholder="Tracking Code">

<input type="text" id="from" placeholder="From">

<input type="text" id="to" placeholder="To">

<select id="status">
<option>In Transit</option>
<option>Processing</option>
<option>Held At Customs</option>
<option>Out For Delivery</option>
<option>Delivered</option>
</select>

<input type="text" id="weight" placeholder="Weight">

<input type="text" id="parcelType" placeholder="Parcel Type">

<input type="text" id="courier" placeholder="Courier">

<input type="text" id="eta" placeholder="ETA Date">

<textarea
id="timeline"
placeholder="Timeline Updates (separate with commas)">
</textarea>

<button onclick="saveShipment()">
SAVE SHIPMENT
</button>

<button class="logout" onclick="logout()">
LOGOUT
</button>

<div class="success" id="successBox">
Shipment Saved Successfully
</div>

<div class="shipment-list" id="shipmentList">

</div>

</div>

</div>

<script>

/* PASSWORD */

const ADMIN_PASSWORD = "monarchadmin";

/* LOGIN */

function login(){

const password =
document.getElementById("adminPassword").value;

if(password === ADMIN_PASSWORD){

document.getElementById("loginScreen")
.classList.add("hidden");

document.getElementById("dashboard")
.classList.remove("hidden");

loadShipments();

}else{

alert("Incorrect Password");

}

}

/* LOGOUT */

function logout(){

location.reload();

}

/* SAVE SHIPMENT */

function saveShipment(){

const shipment = {

trackingCode:
document.getElementById("trackingCode").value,

from:
document.getElementById("from").value,

to:
document.getElementById("to").value,

status:
document.getElementById("status").value,

weight:
document.getElementById("weight").value,

parcelType:
document.getElementById("parcelType").value,

courier:
document.getElementById("courier").value,

eta:
document.getElementById("eta").value,

timeline:
document.getElementById("timeline").value

};

if(!shipment.trackingCode){
alert("Tracking code required");
return;
}

let shipments =
JSON.parse(localStorage.getItem("shipments")) || [];

shipments.push(shipment);

localStorage.setItem(
"shipments",
JSON.stringify(shipments)
);

document.getElementById("successBox").style.display =
"block";

setTimeout(()=>{

document.getElementById("successBox").style.display =
"none";

},3000);

loadShipments();

}

/* LOAD SHIPMENTS */

function loadShipments(){

const shipmentList =
document.getElementById("shipmentList");

shipmentList.innerHTML = "";

let shipments =
JSON.parse(localStorage.getItem("shipments")) || [];

shipments.reverse().forEach((shipment)=>{

shipmentList.innerHTML += `

<div class="shipment-item">

<h3>${shipment.trackingCode}</h3>

<p>Status: ${shipment.status}</p>

<div class="link-box">
https://monarchfreightgroup.github.io/tracking.html?code=${shipment.trackingCode}
</div>

</div>

`;

});

}

</script>

</body>
</html>
