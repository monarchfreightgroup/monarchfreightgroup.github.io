<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monarch Freight Group</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#efb6ac;
display:flex;
justify-content:center;
padding:40px 20px;
}

.card{
width:100%;
max-width:700px;
background:#55525c;
border-radius:25px;
overflow:hidden;
color:white;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.hero-image{
width:100%;
height:420px;
object-fit:cover;
display:block;
}

.content{
padding:40px;
}

.small-title{
font-size:18px;
opacity:0.8;
margin-bottom:20px;
}

.main-title{
font-size:58px;
line-height:1.1;
font-weight:300;
margin-bottom:20px;
}

.line{
width:90px;
height:6px;
background:#efb6ac;
border-radius:20px;
margin-bottom:30px;
}

.description{
font-size:20px;
line-height:1.8;
opacity:0.9;
margin-bottom:35px;
}

.track-btn{
width:100%;
background:#6b6872;
border:none;
padding:22px;
border-radius:12px;
font-size:28px;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer;
margin-bottom:35px;
}

.track-btn:hover{
opacity:0.9;
}

.icons{
display:flex;
gap:18px;
justify-content:center;
}

.icon{
width:55px;
height:55px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:24px;
background:#f9d7cf;
color:#555;
text-decoration:none;
}

.footer{
text-align:center;
margin-top:18px;
font-size:14px;
opacity:0.7;
color:#333;
}

@media(max-width:768px){

.main-title{
font-size:46px;
}

.description{
font-size:18px;
}

.track-btn{
font-size:24px;
}
}
</style>
</head>

<body>

<div>
<div class="card">

<img class="hero-image" src="https://images.unsplash.com/photo-1578575437130-527eed3abbec?q=80&w=1400&auto=format&fit=crop" alt="Port">

<div class="content">

<div class="small-title">
International Freight Forwarding
</div>

<div class="main-title">
Monarch Freight<br>
Group
</div>

<div class="line"></div>

<div class="description">
Monarch Freight Group provides international freight forwarding, cargo handling, shipment tracking, air freight, sea freight, and reliable global logistics solutions.
</div>

<button class="track-btn" onclick="goTrack()">
<span>Track Shipment</span>
<span>➜</span>
</button>

<div class="icons">
<a class="icon" href="#">𝕏</a>
<a class="icon" href="#">◎</a>
<a class="icon" href="#">f</a>
<a class="icon" href="#">♪</a>
<a class="icon" href="#">✉</a>
</div>

</div>
</div>

<div class="footer">
(Made with Carrd)
</div>
</div>

<script>
function goTrack(){
window.location.href = "tracking.html";
}
</script>

</body>
</html>
