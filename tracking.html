<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monarch Freight Tracking</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#efb7aa;
padding:30px 15px;
color:white;
}

.container{
max-width:700px;
margin:auto;
background:#4d4b54;
border-radius:25px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,0.25);
}

.hero-image{
width:100%;
height:320px;
object-fit:cover;
display:block;
}

.content{
padding:35px;
}

.small-text{
font-size:15px;
opacity:0.8;
margin-bottom:15px;
}

h1{
font-size:58px;
line-height:1.05;
font-weight:600;
margin-bottom:20px;
}

.line{
width:90px;
height:6px;
background:#efb7aa;
border-radius:20px;
margin-bottom:25px;
}

.description{
font-size:20px;
line-height:1.8;
opacity:0.9;
margin-bottom:35px;
}

.search-box{
display:flex;
gap:10px;
margin-bottom:25px;
}

.search-box input{
flex:1;
padding:20px;
border:none;
border-radius:14px;
font-size:18px;
outline:none;
}

.search-box button{
padding:20px 30px;
border:none;
background:#efb7aa;
color:white;
font-size:18px;
font-weight:600;
border-radius:14px;
cursor:pointer;
}

.result{
display:none;
margin-top:30px;
background:rgba(255,255,255,0.08);
padding:25px;
border-radius:18px;
}

.status{
background:#d4f5dc;
color:#159447;
padding:12px 18px;
border-radius:30px;
display:inline-block;
font-weight:600;
margin-bottom:20px;
}

.track-code{
font-size:34px;
font-weight:700;
margin-bottom:20px;
}

.info-box{
background:rgba(255,255,255,0.08);
padding:20px;
border-radius:15px;
margin-bottom:18px;
}

.info-title{
font-size:13px;
opacity:0.7;
margin-bottom:8px;
}

.info-value{
font-size:22px;
font-weight:500;
line-height:1.5;
}

.timeline{
margin-top:30px;
}

.timeline h2{
margin-bottom:20px;
font-size:28px;
}

.timeline-item{
display:flex;
gap:15px;
margin-bottom:20px;
align-items:flex-start;
}

.dot{
width:15px;
height:15px;
background:#efb7aa;
border-radius:50%;
margin-top:8px;
}

.timeline-text{
line-height:1.7;
font-size:17px;
}

@media(max-width:700px){

h1{
font-size:42px;
}

.description{
font-size:18px;
}

.search-box{
flex-direction:column;
}

.search-box button{
width:100%;
}

}

</style>
</head>

<body>

<div class="container">

<img class="hero-image" src="https://images.unsplash.com/photo-1578575437130-527eed3abbec?q=80&w=1200&auto=format&fit=crop" alt="Cargo Port">

<div class="content">

<div class="small-text">International Freight Forwarding</div>

<h1>Monarch Freight Group</h1>

<div class="line"></div>

<div class="description">
Track your shipment in real time with Monarch Freight Group global logistics and cargo tracking services.
</div>

<div class="search-box">
<input type="text" id="trackingInput" placeholder="Enter tracking number">
<button onclick="trackShipment()">TRACK</button>
</div>

<div class="result" id="result">

<div class="track-code" id="trackCode"></div>

<div class="status" id="status"></div>

<div class="info-box">
<div class="info-title">FROM</div>
<div class="info-value" id="from"></div>
</div>

<div class="info-box">
<div class="info-title">TO</div>
<div class="info-value" id="to"></div>
</div>

<div class="info-box">
<div class="info-title">WEIGHT</div>
<div class="info-value" id="weight"></div>
</div>

<div class="info-box">
<div class="info-title">PARCEL TYPE</div>
<div class="info-value" id="parcel"></div>
</div>

<div class="info-box">
<div class="info-title">COURIER</div>
<div class="info-value" id="courier"></div>
</div>

<div class="info-box">
<div class="info-title">ETA DATE</div>
<div class="info-value" id="eta"></div>
</div>

<div class="timeline">

<h2>Shipment Timeline</h2>

<div id="timeline"></div>

</div>

</div>

</div>

</div>

<script>

function trackShipment(){

const code = document.getElementById("trackingInput").value.trim();

const shipments = JSON.parse(localStorage.getItem("shipments")) || {};

if(!shipments[code]){
alert("Tracking number not found");
return;
}

const shipment = shipments[code];

document.getElementById("result").style.display = "block";

document.getElementById("trackCode").innerText = shipment.code;
document.getElementById("status").innerText = shipment.status;
document.getElementById("from").innerText = shipment.from;
document.getElementById("to").innerText = shipment.to;
document.getElementById("weight").innerText = shipment.weight;
document.getElementById("parcel").innerText = shipment.parcel;
document.getElementById("courier").innerText = shipment.courier;
document.getElementById("eta").innerText = shipment.eta;

const timelineBox = document.getElementById("timeline");

timelineBox.innerHTML = "";

shipment.timeline.forEach(item => {

timelineBox.innerHTML += `
<div class="timeline-item">
<div class="dot"></div>
<div class="timeline-text">${item}</div>
</div>
`;

});

}

</script>

</body>
</html>
