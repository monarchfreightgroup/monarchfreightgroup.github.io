<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Shipment - Monarch Freight Group</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#f5f5f5;
padding:20px;
color:#222;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h1{
text-align:center;
margin-bottom:20px;
font-size:34px;
}

.search-box{
display:flex;
gap:10px;
margin-bottom:30px;
}

.search-box input{
flex:1;
padding:15px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}

.search-box button{
padding:15px 25px;
border:none;
background:#222;
color:white;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

.result{
display:none;
}

.status-box{
background:#eaf8ee;
padding:15px;
border-radius:10px;
margin-bottom:20px;
font-weight:600;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-bottom:25px;
}

.card{
background:#f8f8f8;
padding:15px;
border-radius:12px;
}

.card h3{
font-size:14px;
margin-bottom:8px;
color:#777;
}

.card p{
font-size:17px;
font-weight:500;
}

.timeline{
margin-top:20px;
}

.timeline-item{
display:flex;
gap:12px;
margin-bottom:18px;
align-items:flex-start;
}

.dot{
width:14px;
height:14px;
background:#222;
border-radius:50%;
margin-top:6px;
}

.timeline-item p{
line-height:1.5;
}

@media(max-width:700px){

.grid{
grid-template-columns:1fr;
}

.search-box{
flex-direction:column;
}

.search-box button{
width:100%;
}

}

</style>
</head>

<body>

<div class="container">

<h1>Track Your Shipment</h1>

<div class="search-box">
<input type="text" id="trackingInput" placeholder="Enter tracking number">
<button onclick="trackShipment()">TRACK</button>
</div>

<div class="result" id="result">

<div class="status-box">
Tracking Code: <span id="trackCode"></span> —
<span id="status"></span>
</div>

<div class="grid">

<div class="card">
<h3>FROM</h3>
<p id="from"></p>
</div>

<div class="card">
<h3>TO</h3>
<p id="to"></p>
</div>

<div class="card">
<h3>WEIGHT</h3>
<p id="weight"></p>
</div>

<div class="card">
<h3>PARCEL TYPE</h3>
<p id="parcel"></p>
</div>

<div class="card">
<h3>COURIER</h3>
<p id="courier"></p>
</div>

<div class="card">
<h3>ESTIMATED DELIVERY</h3>
<p id="eta"></p>
</div>

</div>

<h2>Shipment Timeline</h2>

<div class="timeline" id="timeline"></div>

</div>

</div>

<script>

function trackShipment(){

const code = document.getElementById("trackingInput").value.trim();

const shipments = JSON.parse(localStorage.getItem("shipments")) || {};

if(!shipments[code]){
alert("Tracking number not found");
return;
}

const shipment = shipments[code];

document.getElementById("result").style.display = "block";

document.getElementById("trackCode").innerText = shipment.code;
document.getElementById("status").innerText = shipment.status;
document.getElementById("from").innerText = shipment.from;
document.getElementById("to").innerText = shipment.to;
document.getElementById("weight").innerText = shipment.weight;
document.getElementById("parcel").innerText = shipment.parcel;
document.getElementById("courier").innerText = shipment.courier;
document.getElementById("eta").innerText = shipment.eta;

const timelineBox = document.getElementById("timeline");

timelineBox.innerHTML = "";

shipment.timeline.forEach(item => {

timelineBox.innerHTML += `
<div class="timeline-item">
<div class="dot"></div>
<p>${item}</p>
</div>
`;

});

}

</script>

</body>
</html>
